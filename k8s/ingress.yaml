apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-api-ingress
  namespace: todo-app
  labels:
    app: todo-api
  annotations:
    # Provisions an external Application Load Balancer (HTTP).
    kubernetes.io/ingress.class: "gce"
    # No TLS for the PoC: serve HTTP only.
    kubernetes.io/ingress.allow-http: "true"
spec:
  defaultBackend:
    service:
      name: todo-api-svc
      port:
        number: 8080
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: todo-api-svc
                port:
                  number: 8080
